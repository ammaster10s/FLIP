# The one door through which the host's AWS credentials enter the dev stack (FLIP#1291).
#
# The dev stack needs no AWS account: sign-in is the local Keycloak, email is the console
# backend and object storage is the RustFS container — so compose.development.yml mounts
# nothing from ~/.aws. The two dev opt-ins that DO reach AWS, AUTH_BACKEND=cognito and
# EMAIL_BACKEND=ses, need the operator's SSO session inside flip-api, and this overlay
# hands it over: the root Makefile appends it to every compose command when AWS_PROFILE is
# set in the env file (and only in development — the production composes authenticate
# through the task role and mount nothing). A bind-mount of a missing ~/.aws path would
# make docker create it as a root-owned directory, which is why these lines are not simply
# left in the base compose for everyone.
#
# flip-api only. The fl-servers upload results to the object store with the static dev
# keys and never need a profile, and the object store's own credentials are S3-scoped
# settings (S3_ACCESS_KEY_ID / S3_SECRET_ACCESS_KEY, see flip-api/AGENTS.md) so the
# profile mounted here is never shadowed by them.

services:
  flip-api:
    volumes:
      - ~/.aws/config:/home/flip/.aws/config:ro
      - ~/.aws/sso/cache:/home/flip/.aws/sso/cache:rw
    environment:
      - AWS_PROFILE=${AWS_PROFILE:?AWS_PROFILE must be set to use the AWS overlay}
