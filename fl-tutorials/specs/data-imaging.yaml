id: IMG
title: Imaging tutorials (2-D DICOM through MONAI, or 3-D NIfTI converted by XNAT)
skill: new-tutorial-imaging
applies_when: {data: [imaging_2d, imaging_3d]}
rules:
  - id: IMG-01
    level: MUST
    statement: query.sql projects accession_id (imaging-api resolves studies by it; the frozen membership keeps it)
    when: {query_from: null}
    check: {type: file_regex, path: query.sql, pattern: '\baccession_id\b'}
  - id: IMG-02
    level: MUST
    statement: The platform project has imaging on (manifest platform.has_imaging true)
    check: {type: manifest, field: platform.has_imaging, equals: true}
  - id: IMG-03
    level: MUST
    statement: Images are fetched only through flip.get_by_accession_number
    check: {type: files_regex, glob: 'app*/**/*.py', expect: any, pattern: 'get_by_accession_number'}
  - id: IMG-04
    level: MUST
    statement: A 2-D DICOM app read through MONAI LoadImaged is registered in tests/tutorial_apps.py DICOM_APPS (the orientation suite then covers it)
    why: FLIP#821 — a figure stayed upright while the model trained on transposed images; the transform suite is the evidence
    when: {data: imaging_2d}
    check: {type: file_regex, path: '{fl_tutorials}/tests/tutorial_apps.py', pattern: 'module_path="{backend}/([^"]*/)?{name}/'}
  - id: IMG-05
    level: MUST
    statement: .env.app points the simulator at an images dir (DEV_IMAGES_DIR or SITE1_IMAGES_DIR)
    when: {backend: nvflare}
    check: {type: file_regex, path: .env.app, pattern: 'IMAGES_DIR='}
  - id: IMG-06
    level: SHOULD
    statement: A 3-D tutorial's e2e target carries the label-enrichment step (ENRICHMENT_ARGS) between the image pull and training
    when: {data: imaging_3d, platform.e2e_target: '*'}
    check: {type: file_regex, path: '{repo_root}/flip-api/Makefile', pattern: '^{e2e_target}: ENRICHMENT_ARGS'}
  - id: IMG-07
    level: SHOULD
    statement: The manifest declares a GPU simulator (imaging training on CPU is a debugging mode, not the documented path)
    check: {type: manifest, field: simulator.device, equals: gpu}
  - id: IMG-08
    level: SHOULD
    statement: A 3-D training README quotes the label-upload (enrichment) target the trusts need before training
    when: {data: imaging_3d, loop: [standard, fine_tune, fed_opt]}
    check: {type: file_regex, path: README.md, pattern: 'upload-[a-z-]*labels', ignore_case: true}
  - id: IMG-09
    level: MUST
    statement: The demo-video profile keeps imaging on (the XNAT/OHIF segment is recorded)
    check: {type: builtin, name: demo_profile_has_imaging, equals: true}
  - id: IMG-10
    level: SHOULD
    statement: Where the README figure reads pixels through pydicom/nibabel rather than the app's transform chain, the script docstring and the README say so
    check: {type: manual}
  - id: IMG-11
    level: SHOULD
    statement: 3-D NIfTI apps are left out of DICOM_APPS on purpose (the orientation suite is for the 2-D DICOM path)
    when: {data: imaging_3d}
    check: {type: manual}
