#
# Training loops that are not plain FedAvg of a freshly initialised model: fine-tuning a shipped
# checkpoint with part of the model frozen or aggregated only (arkplus_fine_tuning), the FedOpt
# recipe (a template with no tutorial yet), and a two-stage job training an autoencoder then a
# diffusion model (latent_diffusion_model, NVFLARE only).
id: TRV
title: Training variants (fine-tune from a checkpoint, FedOpt, two-stage)
skill: new-tutorial-training-variants
applies_when: {loop: [fine_tune, fed_opt, two_stage]}
rules:
  - id: TRV-01
    level: MUST
    statement: config.json names the shipped checkpoint the server seeds round 0 from (SERVER_CHECKPOINT)
    when: {loop: fine_tune, backend: nvflare}
    check: {type: json_key, path: app_files/config.json, key: SERVER_CHECKPOINT}
  - id: TRV-02
    level: MUST
    statement: config.json restricts aggregation to the trained part (AGGREGATE_ONLY_REGEX), so the frozen backbone is never averaged
    when: {loop: fine_tune, backend: nvflare}
    check: {type: json_key, path: app_files/config.json, key: AGGREGATE_ONLY_REGEX}
  - id: TRV-03
    level: MUST
    statement: The checkpoint is staged by a Makefile target the manifest names (weights_target); it is never fetched at run time
    when: {loop: [fine_tune, two_stage]}
    check: {type: manifest, field: weights_target, not_null: true}
  - id: TRV-04
    level: MUST
    statement: A two-stage job runs on NVFLARE (FlipDiffusionRecipe); Flower has no two-stage template
    when: {loop: two_stage}
    check: {type: manifest, field: backend, equals: nvflare}
  - id: TRV-05
    level: MUST
    statement: A two-stage job's type is diffusion_model (trainer.py + validator.py + config.json + models.py required)
    when: {loop: two_stage}
    check: {type: manifest, field: job_type, equals: diffusion_model}
  - id: TRV-06
    level: MUST
    statement: job.py passes the two round counts (num_rounds_ae / num_rounds_dm) to the recipe
    when: {loop: two_stage}
    check: {type: file_regex, path: job.py, pattern: 'num_rounds_ae|NUM_ROUNDS_AE', ignore_case: true}
  - id: TRV-07
    level: MUST
    statement: A FedOpt job's type is fed_opt (FlipFedOptRecipe with optimizer_args / lr_scheduler_args)
    when: {loop: fed_opt}
    check: {type: manifest, field: job_type, equals: fed_opt}
  - id: TRV-08
    level: SHOULD
    statement: job.py builds FlipFedOptRecipe
    when: {loop: fed_opt}
    check: {type: file_regex, path: job.py, pattern: 'FlipFedOptRecipe'}
  - id: TRV-09
    level: SHOULD
    statement: README carries a Mermaid flow block of the loop (what differs from plain FedAvg; the generic job-type figure lives in the docs)
    check: {type: file_regex, path: README.md, pattern: '```mermaid'}
  - id: TRV-10
    level: SHOULD
    statement: README says which parts of the model are frozen, aggregated or trained per stage, and why
    check: {type: manual}
