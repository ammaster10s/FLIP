#
# What the tutorial's dataset target may do depends on the source's licence (dataset.tier):
#   public             a download / derive script under fl-tutorials/datasets/<name>/
#   access_controlled  a converter the licence holder runs against their own download; nothing
#                      derived from the data enters the repository (no rows, tables, splits,
#                      subject-level figures or thinned fixtures)
#   private            a trust's own cohort: synthetic stand-in locally, the real cohort only
#                      through query.sql on the platform
id: DATA
title: Datasets and dev data (every tier; the tier picks which rules apply)
skill: new-tutorial-datasets
rules:
  - id: DATA-01
    level: MUST
    statement: The dataset target the manifest names resolves at the fl-tutorials root (DATASET_TARGETS forwards it)
    enforced_by: tests/test_fl_tutorials_make_targets.py for every target a README quotes
    check: {type: make_target, makefile_dir: '{fl_tutorials}', target_from: dataset.target}
  - id: DATA-02
    level: SHOULD
    statement: README quotes the dataset target in its root form (make -C fl-tutorials <target>)
    check: {type: file_regex, path: README.md, pattern: 'make -C fl-tutorials {dataset_target}'}
  - id: DATA-03
    level: SHOULD
    statement: The dataset has its own directory (and uv project) under fl-tutorials/datasets/
    check: {type: file_exists, path: '{fl_tutorials}/datasets/{dataset_name}'}
  - id: DATA-04
    level: SHOULD
    statement: The dataset tooling has tests under fl-tutorials/tests/datasets/<name>/ and the name is in DATASET_TEST_PROJECTS
    check: {type: file_exists, path: '{fl_tutorials}/tests/datasets/{dataset_name}'}
  - id: DATA-05
    level: MUST
    statement: Nothing derived from an access-controlled source is committed — no rows, per-subject tables, per-site splits, subject-level figures or thinned fixtures; CPU tests use invented, source-shaped fixtures
    when: {dataset.tier: access_controlled}
    check: {type: manual}
  - id: DATA-06
    level: MUST
    statement: The converter target refuses an output path inside the repository that git does not ignore, and prints counts, never a row
    when: {dataset.tier: access_controlled}
    check: {type: file_regex, path: '{fl_tutorials}/datasets/Makefile', pattern: 'check-ignore'}
  - id: DATA-07
    level: MUST
    statement: README documents the real-data path as numbered steps (how to apply, the exact source tables, the converter command, the run command pointing DEV_DATAFRAME / SIM_DATA_ROOT at the result)
    when: {dataset.tier: access_controlled}
    check: {type: file_regex, path: README.md, pattern: 'data use agreement|apply for access|application', ignore_case: true}
  - id: DATA-08
    level: MUST
    statement: No demo video (a recording would show values derived from the controlled data); waive COMMON-18 with that reason
    when: {dataset.tier: access_controlled}
    check: {type: manifest, field: platform.demo_profile, is_null: true}
  - id: DATA-09
    level: MUST
    statement: The cohort is never seeded on the shared dev trusts; a licence holder loads their converted cohort into local trusts
    when: {dataset.tier: access_controlled}
    check: {type: manual}
  - id: DATA-10
    level: SHOULD
    statement: README states which numbers come from a real run under the author's own access, what the licence allows to be reported (summary results, acknowledgement, download date) and whether it restricts AI tools over the data
    when: {dataset.tier: access_controlled}
    check: {type: manual}
  - id: DATA-11
    level: MUST
    statement: The simulator path runs on a synthetic stand-in calibrated only to published summary statistics; the real cohort is reached only through query.sql on the platform
    when: {dataset.tier: private}
    check: {type: manual}
  - id: DATA-12
    level: SHOULD
    statement: A large or re-packaged public source is re-hosted under aicentreflip on Hugging Face, or fetched by a make download-raw-* target the user runs
    when: {dataset.tier: public}
    check: {type: manual}
  - id: DATA-13
    level: SHOULD
    statement: A dataset that must also exist on the platform (e2e, demo) carries the OMOP chain from datasets/utils/ (metadata table, omop_convert_<dataset>.py, canonical build, verify_omop_tables.py --project, seed-<dataset>) and bumps trust/.data_version when published
    when: {platform.e2e_target: '*'}
    check: {type: manual}
