# A statistical tutorial trains nothing: a parameter-free module carries sufficient statistics
# (or votes) and FedAvg's size-weighted mean is used as the summation channel. The precedent is
# biomarker_causal_discovery (bootstrapped FCI over pooled Fisher-z statistics, or FedPC-style
# layer voting), whose federated_fci.py names the guards below.
id: STAT
title: Statistical tutorials (no trainable parameters; statistics summed through FedAvg)
skill: new-tutorial-statistical
applies_when: {model: statistical}
rules:
  - id: STAT-01
    level: MUST
    statement: The manifest's loop is statistics_fedavg (the model spec carries the loop rules)
    check: {type: manifest, field: loop, equals: statistics_fedavg}
  - id: STAT-02
    level: MUST
    statement: config.json asks for at least two global rounds (statistics first, the result on the next)
    why: with one round the per-site statistics themselves would be the published result
    check: {type: json_key, path: '{app_dir}/config.json', key: GLOBAL_ROUNDS, value_type: int, min: 2}
  - id: STAT-03
    level: MUST
    statement: The app refuses to run a one-round job rather than publishing the statistics
    check: {type: files_regex, glob: 'app*/**/*.py', expect: any, pattern: 'at least 2'}
  - id: STAT-04
    level: MUST
    statement: Client-side differential privacy is off (dp-enabled = false) — clipping and noising pooled moments or votes breaks the arithmetic
    when: {backend: flower}
    check: {type: toml_key, path: pyproject.toml, key: tool.flwr.app.config.dp-enabled, equals: false}
  - id: STAT-05
    level: MUST
    statement: The README has a privacy section that says what each site sends, what the filters do to it, and why DP is off
    check: {type: file_regex, path: README.md, pattern: '^## .*privacy', ignore_case: true}
  - id: STAT-06
    level: MUST
    statement: Best-model selection is off on NVFLARE (no BEST_MODEL_METRIC in config.json wires no selector)
    when: {backend: nvflare}
    check: {type: json_key, path: app_files/config.json, key: BEST_MODEL_METRIC, absent: true}
  - id: STAT-07
    level: MUST
    statement: Best-model selection is off on Flower (best-model-metric = "")
    when: {backend: flower}
    check: {type: toml_key, path: pyproject.toml, key: tool.flwr.app.config.best-model-metric, equals: ''}
  - id: STAT-08
    level: MUST
    statement: The site's row count rides as the FedAvg weight on NVFLARE (NUM_STEPS_CURRENT_ROUND), so the mean is the pooled statistic
    when: {backend: nvflare}
    check: {type: file_regex, path: app_files/trainer.py, pattern: 'NUM_STEPS_CURRENT_ROUND'}
  - id: STAT-09
    level: MUST
    statement: The site's row count rides as the FedAvg weight on Flower (num-examples)
    when: {backend: flower}
    check: {type: file_regex, path: app/client_app.py, pattern: 'num-examples'}
  - id: STAT-10
    level: MUST
    statement: The payload is shaped to pass the NVFLARE percentile privacy filter untouched, and the app asserts it (assert_within_filter_bounds) rather than let a clipped value through
    check: {type: files_regex, glob: 'app*/**/*.py', expect: any, pattern: 'assert_within_filter_bounds'}
  - id: STAT-11
    level: MUST
    statement: The trust's own disclosure floor (COHORT_QUERY_THRESHOLD) is read again on the FL client
    check: {type: files_regex, glob: 'app*/**/*.py', expect: any, pattern: 'COHORT_QUERY_THRESHOLD'}
  - id: STAT-12
    level: MUST
    statement: A hard minimum site size that config can only raise (MIN_SITE_ROWS)
    check: {type: files_regex, glob: 'app*/**/*.py', expect: any, pattern: 'MIN_SITE_ROWS'}
  - id: STAT-13
    level: MUST
    statement: A small-cell floor on discrete levels (MIN_CELL_COUNT)
    check: {type: files_regex, glob: 'app*/**/*.py', expect: any, pattern: 'MIN_CELL_COUNT'}
  - id: STAT-14
    level: MUST
    statement: Refusals name neither the count nor the column that tripped them
    check: {type: manual}
  - id: STAT-15
    level: MUST
    statement: Any mode that publishes more than the pooled statistic (per-layer votes, per-site edges) runs under LOCAL_DEV only
    check: {type: manual}
  - id: STAT-16
    level: MUST
    statement: README ends with References naming the federated method built on (and where the tutorial departs from it)
    check: {type: file_regex, path: README.md, pattern: '^## .*References', ignore_case: true}
  - id: STAT-17
    level: SHOULD
    statement: Expected performance is an agreement table (centralised vs pooled vs voting, edge frequencies) with failure signatures, not a training curve
    check: {type: manual}
  - id: STAT-18
    level: SHOULD
    statement: The model module registers buffers only (no trainable parameters) and the README says so
    check: {type: files_regex, glob: 'app*/models.py', expect: all, pattern: 'register_buffer'}
  - id: STAT-19
    level: SHOULD
    statement: The cohort is fetched once per run (Flower caches it in context.state; NVFLARE loads it before the round loop)
    check: {type: manual}
