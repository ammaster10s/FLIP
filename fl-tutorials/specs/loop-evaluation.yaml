id: EVAL
title: Evaluation tutorials (no training; an uploaded checkpoint is evaluated at every site)
skill: new-tutorial-evaluation
applies_when: {loop: evaluation}
rules:
  - id: EVAL-01
    level: MUST
    statement: The job type is evaluation (FlipEvalRecipe on NVFLARE, the fl-apps/flower/evaluation template on Flower)
    check: {type: manifest, field: job_type, equals: evaluation}
  - id: EVAL-02
    level: MUST
    statement: app_files/evaluator.py is an NVFLARE Client-API loop
    when: {backend: nvflare}
    check: {type: file_regex, path: app_files/evaluator.py, pattern: 'flare\.init\('}
  - id: EVAL-03
    level: MUST
    statement: num-server-rounds = 1 (one evaluation pass)
    when: {backend: flower}
    check: {type: toml_key, path: pyproject.toml, key: tool.flwr.app.config.num-server-rounds, equals: 1}
  - id: EVAL-04
    level: MUST
    statement: pyproject declares the checkpoint key the ServerApp opens under flip-job-dir
    when: {backend: flower}
    check: {type: toml_key, path: pyproject.toml, key: tool.flwr.app.config.checkpoint}
  - id: EVAL-05
    level: MUST
    statement: No dp-* keys (nothing is trained, so there is nothing to clip or noise)
    when: {backend: flower}
    check: {type: toml_key, path: pyproject.toml, key: tool.flwr.app.config.dp-enabled, absent: true}
  - id: EVAL-06
    level: MUST
    statement: The manifest names the Makefile target that stages the checkpoint host-side (weights_target)
    check: {type: manifest, field: weights_target, not_null: true}
  - id: EVAL-07
    level: MUST
    statement: sim-tutorial.sh supplies the RUN_CONFIG the platform's submit step would (flip-job-dir + checkpoint)
    when: {backend: flower}
    check: {type: file_regex, path: '{fl_tutorials}/flower/sim-tutorial.sh', pattern: '"\$TUTORIAL" = {name}\b'}
  - id: EVAL-08
    level: MUST
    statement: A Flower evaluation tutorial reuses its training tutorial's cohort (manifest query_from; COMMON-29/30 check the files)
    when: {backend: flower}
    check: {type: manifest, field: query_from, not_null: true}
  - id: EVAL-09
    level: MUST
    statement: .env.app names the checkpoint source (MODEL_CHECKPOINT_URL) for the download-checkpoints target
    when: {backend: flower}
    check: {type: file_regex, path: .env.app, pattern: '^MODEL_CHECKPOINT_URL=https://'}
  - id: EVAL-10
    level: MUST
    statement: Not recorded with the demo recorder as it stands (segments 4-5 assume create model -> train -> live metrics); demo_profile stays null until an evaluation variant exists
    check: {type: manifest, field: platform.demo_profile, is_null: true}
  - id: EVAL-11
    level: SHOULD
    statement: README says plainly that the job trains nothing and what the metrics it reports mean per site
    check: {type: manual}
  - id: EVAL-12
    level: SHOULD
    statement: README names the training tutorial whose cohort and checkpoint it evaluates
    check: {type: manual}
