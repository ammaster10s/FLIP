# Tutorial profile — selects the specs in fl-tutorials/specs/ (see specs/README.md).
# Two-stage job (autoencoder, then diffusion model) on the spleen volumes; NVFLARE only.
name: latent_diffusion_model
backend: nvflare
data: imaging_3d
model: deep_learning
loop: two_stage
job_type: diffusion_model
twin: null
query_from: 3d_spleen_segmentation  # trains on the spleen volumes; FLIP_QUERY is a stub in .env.app
dataset: {name: spleen, tier: public, target: download-spleen-data}
platform: {has_imaging: true, e2e_target: null, demo_profile: null}
simulator: {device: gpu}
weights_target: weights
